name: TikTok Live Status APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Android Plattform installieren
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Festen Signaturschluessel wiederherstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "FEHLER: Signaturschluessel fehlt."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Versionsnummer automatisch vergeben
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path('app/build.gradle')
          content = path.read_text(encoding='utf-8')
          run = int(os.environ['RUN_NUMBER'])
          # Stable, increasing per workflow run. Well above previous versionCode 4.
          code = 100000 + run
          name = f'1.3.{run}'
          content, code_matches = re.subn(r'(?m)^(\s*versionCode\s+)\d+', lambda m: m.group(1) + str(code), content, count=1)
          content, name_matches = re.subn(r'(?m)^(\s*versionName\s+)[\'\"][^\'\"]+[\'\"]', lambda m: m.group(1) + '"' + name + '"', content, count=1)
          if code_matches != 1 or name_matches != 1:
              raise SystemExit('FEHLER: versionCode oder versionName in app/build.gradle fehlt.')
          path.write_text(content, encoding='utf-8')
          print(f'APK-Version: {name} (versionCode {code})')
          PY

      - name: AndroidManifest pruefen
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('app/src/main/AndroidManifest.xml')
          print('AndroidManifest.xml ist gueltiges XML.')
          PY

      - name: APK erstellen
        run: gradle --no-daemon :app:assembleDebug --stacktrace --info

      - name: APK-Signatur anzeigen
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: APK automatisch nach Version benennen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil
          gradle = Path('app/build.gradle').read_text(encoding='utf-8')
          match = re.search(r'(?m)^\s*versionName\s+[\'\"]([^\'\"]+)[\'\"]', gradle)
          if not match:
              raise SystemExit('FEHLER: versionName fehlt.')
          source = Path('app/build/outputs/apk/debug/app-debug.apk')
          destination = source.with_name(f'TikTok-LIVE-{match.group(1)}.apk')
          shutil.copy2(source, destination)
          print(f'APK bereit: {destination}')
          PY

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-LIVE-APK
          path: app/build/outputs/apk/debug/TikTok-LIVE-*.apk
          if-no-files-found: error
