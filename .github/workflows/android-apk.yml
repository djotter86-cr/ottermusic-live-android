
name: TikTok Live Status APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Projekt herunterladen
        uses: actions/checkout@v4

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Android Plattform installieren
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Festen Signaturschluessel wiederherstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "FEHLER: Signaturschluessel fehlt."
            exit 1
          fi

          mkdir -p "$HOME/.android"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > "$HOME/.android/debug.keystore"

          chmod 600 "$HOME/.android/debug.keystore"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

      - name: AndroidManifest pruefen
        run: |
          echo "Pruefe die AndroidManifest.xml..."
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"

          try:
              ET.parse(path)
              print("AndroidManifest.xml ist gueltiges XML.")
          except ET.ParseError as error:
              print("FEHLER in AndroidManifest.xml:")
              print(error)
              raise SystemExit(1)
          PY

      - name: APK erstellen
        run: gradle --no-daemon :app:assembleDebug --stacktrace --info

      - name: APK-Signatur anzeigen
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Live-Status-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
