
plugins {
    id 'com.android.application'
}

android {
    namespace 'de.ottermusic.livestatus'
    compileSdk 35

    defaultConfig {
        applicationId 'de.ottermusic.livestatus'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        fixedDebug {
            storeFile file(
                System.getProperty("user.home") + "/.android/debug.keystore"
            )
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixedDebug
        }

        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
